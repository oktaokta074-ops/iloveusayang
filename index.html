<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>For You</title>
<link href="https://fonts.googleapis.com/css2?family=Gelasio:wght@400;500&family=Libre+Baskerville&family=Monsieur+La+Doulaise&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body class="on-home">
<div id="bg"></div>
<button class="home-btn" data-home>⌂ Start</button>

<section class="page active" id="home">
  <h1 class="script big" data-type></h1>
  <p class="sub" data-type-sub></p>
  <div class="bubble">Hi, you! 💙</div>
  <img class="cat home-cat" data-cat="happy" src="cat-happy.GIF" alt="">
  <button class="btn bottom" data-go="envelope">Start</button>
</section>

<section class="page" id="envelope">
  <h1 class="script med" data-type></h1>
  <p class="sub small">A little letter is waiting for you 💌</p>
  <div class="env" id="env">
    <div class="e-back"></div>
    <div class="e-letter"><i></i><i></i><i></i></div>
    <div class="e-left"></div><div class="e-right"></div><div class="e-bottom"></div>
    <div class="e-flap"></div>
    <div class="seal">♥</div>
  </div>
  <div class="btn-stack">
    <button class="btn" id="readBtn">Read</button>
    <button class="btn" data-go="time">I need more time</button>
  </div>
</section>

<section class="page scroll" id="letter">
  <h1 class="script big" data-type></h1>
  <div class="player" id="player">
    <img class="cover" id="cover" alt="cover">
    <div class="info">
      <b id="songTitle">Song Title</b>
      <div><span class="tag">Preview</span><span id="songArtist">Artist Name</span></div>
      <div class="save">⊕ <span>Save on Spotify</span></div>
    </div>
    <button class="play" id="playBtn" aria-label="play">▶</button>
    <audio id="audio" loop></audio>
  </div>
  <div class="letter" id="letterText"></div>
  <button class="btn" data-go="reasons">Continue</button>
</section>

<section class="page scroll" id="reasons">
  <h1 class="script med" data-type></h1>
  <p class="sub small">Tap each heart to open it</p>
  <div class="cards" id="cards"></div>
  <button class="btn" id="reasonsNext" data-go="cheer" disabled>Continue</button>
</section>

<section class="page scroll" id="cheer">
  <h1 class="script med" data-type></h1>
  <p class="sub small">Tap the cat 5 times for a surprise</p>
  <div class="bubble" id="bubble">Psst... tap me!</div>
  <img id="catTap" class="cat tap-cat" data-cat="idle" src="cat-idle.GIF" alt="">
  <p class="count" id="tapCount">0 / 5</p>
  <button class="btn" id="cheerNext" data-go="forgive" disabled>Continue</button>
</section>

<section class="page" id="forgive">
  <h1 class="script med" data-type></h1>
  <div class="bubble">pretty please? 🥺</div>
  <img class="cat center-cat" data-cat="idle" src="cat-idle.GIF" alt="">
  <div class="choices">
    <button class="btn" data-go="yes">Yes</button>
    <button class="btn" data-go="time">I need more time</button>
  </div>
</section>

<section class="page" id="yes">
  <h1 class="script med" data-type></h1>
  <img class="cat yes-cat" data-cat="happy" src="cat-happy.GIF" alt="">
  <p class="sub small">I knew it! 💙</p>
  <button class="btn bottom" data-go="coupons">Continue</button>
</section>

<section class="page scroll" id="coupons">
  <h1 class="script med" data-type></h1>
  <p class="sub small">Tap a coupon to redeem it</p>
  <div class="coupons" id="couponList"></div>
  <button class="btn" data-go="promise">Continue</button>
</section>

<section class="page" id="promise">
  <h1 class="script med" data-type></h1>
  <div class="row">
    <img class="cat" data-cat="hug" src="cat-hug.GIF" alt="">
    <h2 class="serif">I Love You, Love!</h2>
  </div>
  <div class="btn-row">
    <button class="btn" data-back>Back</button>
    <button class="btn" data-home>Back to start</button>
  </div>
</section>

<section class="page" id="time">
  <h1 class="script med" data-type></h1>
  <div class="row">
    <h2 class="serif">I Love You, Love!</h2>
    <img class="cat" data-cat="heart" src="cat-heart.GIF" alt="">
  </div>
  <div class="btn-row">
    <button class="btn" data-back>Back</button>
    <button class="btn" data-home>Back to start</button>
  </div>
</section>

<script src="script.js"></script>
</body>
</html>
